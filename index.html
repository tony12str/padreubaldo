<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Feliz Cumpleaños Padre Ubaldo</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Música -->
  <audio id="music" loop>
    <source src="sacerdote.mp3" type="audio/mpeg">
  </audio>

  <!-- Fondo -->
  <div class="overlay"></div>

  <!-- Partículas -->
  <div class="stars"></div>

  <section class="container">

    <!-- Cruz -->
    <div class="cross">✝</div>

    <!-- Títulos -->
    <h1>Feliz Cumpleaños</h1>

    <h2>Querido Padre</h2>

    <!-- Mensaje -->
    <p class="message">
      Que Dios bendiga siempre su vida,
      su vocación y su corazón lleno de fe.
      Gracias por compartir esperanza,
      amor y luz en cada corazón.
    </p>

    <!-- FOTO -->
    <div class="photo-frame">
      <img src="padre.jpg" alt="Padre">
    </div>

    <!-- Sacerdote -->
    <div class="priest">

      <div class="head"></div>

      <div class="body">

        <div class="collar"></div>

        <div class="cross-small">✝</div>

      </div>

    </div>

    <!-- Pastel -->
    <div class="cake">

      <div class="candle">
        <div class="flame"></div>
      </div>

      <div class="layer top"></div>
      <div class="layer middle"></div>
      <div class="layer bottom"></div>

    </div>

    <!-- Globos -->
    <div class="balloons">

      <div class="balloon b1"></div>
      <div class="balloon b2"></div>
      <div class="balloon b3"></div>
      <div class="balloon b4"></div>

    </div>

    <!-- Botón -->
    <button id="btn">
      🎵 Activar Bendiciones
    </button>

  </section>

  <script src="script.js"></script>

</body>

</html>
